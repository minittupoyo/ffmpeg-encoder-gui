name: Release

# v* タグを push すると、Windows 版(インストーラ + ポータブル版)をビルドして GitHub Release に添付する。
# 手動実行(workflow_dispatch)ではビルドまでを行い、成果物を Artifacts に置く(Release は作らない)。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # Release の作成に必要

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: タグと package.json のバージョンが一致していることを確認
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::タグ ($GITHUB_REF_NAME) と package.json の version ($version) が一致しません"
            exit 1
          fi

      - run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: テスト
        run: npm test

      - name: ビルド(インストーラ + ポータブル版)
        run: npm run dist

      - name: Release を作成して成果物を添付
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # v1.0.0-rc.1 のようにハイフンを含むタグはプレリリースにする
          flags=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" \
            dist/ffmpeg-encoder-*-setup.exe \
            dist/ffmpeg-encoder-*-portable.exe \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $flags

      - name: 成果物を Artifacts に保存(手動実行時)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/ffmpeg-encoder-*-setup.exe
            dist/ffmpeg-encoder-*-portable.exe
          if-no-files-found: error
